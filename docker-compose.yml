services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: masters_backend
    volumes:
      - ./data:/app/data # Mount the shared data volume (for the DB) using a bind mount
      - ./config.json:/app/config.json:ro # Mount config.json read-only
    ports:
      # --- CORRECTED MAPPING ---
      # Maps port 5000 on your host machine to port 8443 inside the container,
      # which is where Gunicorn is listening (as defined in backend.Dockerfile).
      - "5000:8443"
    restart: unless-stopped
    networks:
      - masters_net
    # Backend depends on scraper (e.g., if scraper creates the DB initially)
    depends_on:
      - scraper

  scraper:
    build:
      context: .
      dockerfile: scraper.Dockerfile
    container_name: masters_scraper
    volumes:
      - ./data:/app/data # Mount the same shared data volume using a bind mount
    # No explicit backend dependency needed for scraper to run
    restart: unless-stopped
    networks:
      - masters_net
    environment:
      - PYTHONUNBUFFERED=1 # Ensures Python logs appear in Docker logs immediately

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: masters_frontend
    ports:
      # Maps port 80 on your host to port 80 in the container (Nginx default)
      # Use "8080:80" or similar if port 80 is busy on your host
      - "80:80"
    # Frontend needs the backend API to be available
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - masters_net

# NOTE on Volumes:
# The services currently use bind mounts (e.g., './data:/app/data').
# If you prefer Docker-managed named volumes for better performance and permission handling,
# you could uncomment the 'volumes' section below and change the service volume mounts
# from './data:/app/data' to 'data:/app/data'.
# The database file would then live inside the Docker-managed volume area, not the ./data folder.
# ---
# volumes:
#   data: {} # Declares a named volume called 'data'

networks:
  masters_net:
    driver: bridge # Use the default bridge driver for the custom network