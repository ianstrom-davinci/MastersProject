server {
    listen 80;
    server_name localhost; # Or your domain if deploying

    # Root directory for static files
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Handle requests for static files directly
    location / {
        try_files $uri $uri/ /index.html; # Fallback for SPA routing
    }

    # Proxy API requests starting with /api/ to the backend service
    location /api/ {
        # The name 'backend' matches the service name in docker-compose.yml
        proxy_pass http://backend:8443; # Internal communication
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: Add caching headers for static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public";
    }
}