server {
    listen 80;
    server_name localhost; # Or your domain if deploying

    # Root directory for static files
    # Make sure this matches the COPY destination in frontend.Dockerfile
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Handle requests for static files directly
    location / {
        # Fallback for SPA routing (React Router, etc.)
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests starting with /api/ to the backend service
    location /api/ {
        # The name 'backend' matches the service name in docker-compose.yml
        # The port 8443 matches the port Gunicorn listens on in backend.Dockerfile
        proxy_pass http://backend:8443; # Internal communication via Docker network

        # Standard proxy headers to forward client info to the backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Optional: Increase timeouts if backend requests are slow (defaults are usually fine)
        # proxy_connect_timeout 60s;
        # proxy_send_timeout 60s;
        # proxy_read_timeout 60s;
    }

    # Optional: Add caching headers for static assets (improves browser performance)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public";
    }

    # Optional: Gzip compression for text-based assets (reduces bandwidth)
    # gzip on;
    # gzip_vary on;
    # gzip_proxied any;
    # gzip_comp_level 6;
    # gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Optional: Security Headers (adjust as needed)
    # add_header X-Frame-Options "SAMEORIGIN";
    # add_header X-Content-Type-Options "nosniff";
    # add_header Referrer-Policy "strict-origin-when-cross-origin";
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; # Only if using HTTPS
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://backend:8443;"; # Example CSP
}